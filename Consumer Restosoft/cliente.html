<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando...</title>
    <meta name="robots" content="noindex, nofollow">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="/css/cliente.css" rel="stylesheet">
</head>

<body>

    <!-- PANTALLA DE CARGA -->
    <div id="loading-screen">
        <div class="loader-content">
            <div class="loader-spinner"></div>
            <p class="loader-text">Cargando restaurante...</p>
        </div>
    </div>

    <!-- APP -->
    <div id="app" style="display:none;">

        <header id="site-header">
            <div class="header-inner">
                <a href="/" class="header-brand">
                    <img id="h-logo" src="" alt="" class="header-logo">
                    <div class="header-text">
                        <span id="h-nombre" class="header-name"></span>
                        <span id="h-slogan" class="header-slogan"></span>
                    </div>
                </a>
                <a id="h-login-btn" href="/login-cliente" class="header-login-btn">
                    <i class="fa-solid fa-user"></i>
                    <span id="h-login-text">Iniciar Sesión</span>
                </a>
            </div>
        </header>

        <main id="sections-container"></main>

        <footer id="site-footer">
            <div class="footer-inner">
                <div class="footer-left">
                    <img id="f-logo" src="" alt="" class="footer-logo">
                    <span id="f-nombre" class="footer-name"></span>
                </div>
                <p id="f-texto" class="footer-copy"></p>
            </div>
            <div id="f-powered" class="footer-powered">
                Potenciado por <strong>RestSoft</strong>
            </div>
        </footer>

    </div>

    <!-- Orden importa: primero consumo, después datos -->
    <script src="js/consumo/apiCliente.js"></script>
    <script type="module" src="js/datos/cliente.js"></script>

    <!-- Arrancar -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            ClienteApp.iniciar();
        });
    </script>
</body>

</html>
