<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RestSoft - Menú y Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/menu-productos.css" />
    <script type="module" src="js/datos/theme-loader.js"></script>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div id="sidebar-container" class="sidebar"></div>

    <main class="main">
        <div class="topbar">
            <button id="menuToggle" class="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>
            <div class="title">
                <h1>Menú y Productos</h1>
                <p>Administración y CRUD de productos del restaurante</p>
            </div>
            <div class="topbar-right">
                <a href="platillo-crear.html" class="btn-primary" style="padding: 12px 22px; width: auto; text-decoration: none;">
                    <i class="fa-solid fa-plus me-2"></i> Crear Platillo
                </a>
                <div id="infoPerfilContainer" class="profile"><p style="color: var(--gray); text-align: center; padding: 20px;">Cargando...</p></div>
            </div>
        </div>

        <div class="card">
            <h3>Productos del menú</h3>
            <p>Listado general de platillos con opciones CRUD</p>
            <div id="productosContainer" class="products-grid">
                <p class="text-muted text-center w-100">Cargando productos...</p>
            </div>
        </div>
    </main>

    <div class="notification-container" id="notificationContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/datos/menuProductos.js"></script>
    <script type="module" src="js/datos/sidebar.js"></script>
    <script type="module" src="js/datos/notificaciones.js"></script>
    
</body>
</html>
