<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RestSoft - Categorías Menú</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/categorias-menu.css" />
    <script type="module" src="js/datos/theme-loader.js"></script>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div id="sidebar-container" class="sidebar"></div>

    <main class="main">
        <div class="topbar">
            <button id="menuToggle" class="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>
            <div class="title">
                <h1>Categorías de Menú</h1>
                <p>Organiza los tipos de productos del restaurante</p>
            </div>
            <div class="topbar-right">
                <div id="infoPerfilContainer" class="profile"><p style="color: var(--gray); text-align: center; padding: 20px;">Cargando...</p></div>
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <h3>Categorías Existentes</h3>
                <p>Lista de categorías para los platos</p>
                <div id="categoriasContainer" class="category-grid">
                    <p class="text-muted text-center w-100">Cargando categorías...</p>
                </div>
            </div>

            <div class="card">
                <div class="card-header-info">
                    <div>
                        <h3 id="formTitle">Crear Nueva Categoría</h3>
                        <p style="color: var(--gray); margin: 0;">Agrega una nueva clasificación</p>
                    </div>
                    <button id="cancelBtn" class="btn-outline" style="display: none; padding: 8px 16px;">
                        <i class="fa-solid fa-xmark"></i> Cancelar
                    </button>
                </div>
                <form id="categoriaForm">
                    <input type="hidden" id="categoriaId" value="">
                    <div class="form-group">
                        <label>Nombre de la Categoría</label>
                        <input type="text" id="nombreCategoria" placeholder="Ej: Bebidas Frías" required>
                    </div>
                    <div class="actions">
                        <button type="submit" class="btn-primary" id="submitBtn">
                            <i class="fa-solid fa-plus me-2"></i> Crear Categoría
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div class="notification-container" id="notificationContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/datos/categoriasMenu.js"></script>
    <script type="module" src="js/datos/sidebar.js"></script>
    <script type="module" src="js/datos/notificaciones.js"></script>
    
</body>
</html>
