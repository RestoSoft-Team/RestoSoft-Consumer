<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RestSoft - Crear Reserva</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {

            --background: #fbfcfb;

            --primary: #6b1e28;
            --primary-light: #8a3b47;

            --dark: #262f3c;
            --dark-light: #39485c;

            --soft: #b09da2;
            --soft-light: #d9d2d4;

            --white: #ffffff;

            --gray: #6f7782;

            --success: #3d8b5c;
            --warning: #d9a441;
            --danger: #bb3a4b;

            --shadow: 0 10px 40px rgba(38, 47, 60, 0.08);

            --radius: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--background);
            color: var(--dark);
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100vh;
            background: var(--dark);
            padding: 28px 22px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 42px;
        }

        .brand-icon {
            width: 58px;
            height: 58px;
            border-radius: 18px;
            background: rgba(255, 255, 255, .08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
        }

        .brand h3 {
            color: white;
            font-weight: 800;
        }

        .brand p {
            color: #cbd3df;
            font-size: 13px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-link {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 18px;
            border-radius: 18px;
            color: #d9e0ea;
            transition: .3s;
        }

        .menu-link:hover {
            background: rgba(255, 255, 255, .06);
            transform: translateX(4px);
            color: white;
        }

        .menu-link.active {
            background: var(--primary);
            color: white;
        }

        /* MAIN */

        .main {
            margin-left: 280px;
            padding: 34px;
        }

        /* TOPBAR */

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 34px;
        }

        .title h1 {
            font-size: 38px;
            font-weight: 800;
        }

        .title p {
            color: var(--gray);
        }

        /* CARD */

        .card {
            background: white;
            border-radius: 32px;
            padding: 32px;
            box-shadow: var(--shadow);
            max-width: 900px;
        }

        .card h3 {
            font-weight: 800;
            margin-bottom: 6px;
        }

        .card p {
            color: var(--gray);
            margin-bottom: 26px;
        }

        /* FORM */

        label {
            font-weight: 600;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            height: 55px;
            border: none;
            background: #f7f8fa;
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 18px;
            transition: .3s;
        }

        input:focus,
        select:focus {
            outline: none;
            border: 1px solid var(--primary);
            background: white;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            border: none;
            background: #f7f8fa;
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 18px;
        }

        /* GRID */

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        /* BUTTON */

        .btn-primary {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-weight: 600;
            transition: .3s;
        }

        .btn-primary:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
        }

        .btn-outline {
            width: 100%;
            border: 2px solid var(--dark);
            background: none;
            border-radius: 16px;
            padding: 16px;
            font-weight: 600;
        }

        /* SUMMARY */

        .summary {
            margin-top: 26px;
            padding: 22px;
            background: #fafafa;
            border-radius: 22px;
        }

        .summary h5 {
            font-weight: 700;
            margin-bottom: 14px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .summary-item span {
            color: var(--gray);
        }

        .total {
            border-top: 1px solid #eee;
            margin-top: 14px;
            padding-top: 14px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 800;
        }

        /* RESPONSIVE */

        @media(max-width:992px) {

            .main {
                margin-left: 90px;
            }

            .sidebar {
                width: 90px;
            }

        }

        @media(max-width:768px) {

            .grid {
                grid-template-columns: 1fr;
            }

        }
    </style>


<style id="responsive-sidebar-upgrade">
.mobile-menu-btn{display:none;border:none;background:var(--primary);color:#fff;width:50px;height:50px;border-radius:14px;font-size:20px}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:.3s;z-index:998}
.sidebar-overlay.show{opacity:1;visibility:visible}

@media(max-width:992px){
    .sidebar{width:90px}
    .sidebar .menu-title,.sidebar .logo h3{display:none}
    .sidebar .menu-item span{display:none}
    .main{margin-left:90px}
}

@media(max-width:768px){
    .sidebar{
        width:280px!important;
        left:-280px!important;
        transition:.3s;
        z-index:999;
    }

    .sidebar.open{left:0!important}

    .sidebar .menu-title,
    .sidebar .logo h3,
    .sidebar .menu-item span{
        display:block;
    }

    .main{
        margin-left:0!important;
        padding:18px!important;
    }

    .mobile-menu-btn{
        display:flex;
        align-items:center;
        justify-content:center;
    }

    .topbar{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }

    .topbar-actions{
        width:100%;
        flex-direction:column;
    }

    .search-box{
        width:100%;
        min-width:100%;
    }
}
</style>

</head>

<body>

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-icon">
                <i class="fa-solid fa-calendar-plus"></i>
            </div>

            <div>
                <h3>RestSoft</h3>
                <p>Reservas</p>
            </div>

        </div>

        <div class="menu">

            <a class="menu-link" href="#">Dashboard</a>

            <a class="menu-link active" href="#">Crear Reserva</a>

            <a class="menu-link" href="#">Reservas</a>

            <a class="menu-link" href="#">Mesas</a>

        </div>

    </aside>

    <!-- MAIN -->

    <main class="main">

        <div class="topbar">
<button id="menuToggle" class="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>

            <div class="title">

                <h1>Crear Reserva</h1>

                <p>Registra una nueva reserva en el sistema</p>

            </div>

        </div>

        <div class="card">

            <h3>Nueva Reserva</h3>

            <p>Completa los datos del cliente y la reserva</p>

            <form>

                <label>Nombre del cliente</label>
                <input type="text" placeholder="Ej. Juan Pérez">

                <div class="grid">

                    <div>

                        <label>Fecha</label>
                        <input type="date">

                    </div>

                    <div>

                        <label>Hora</label>
                        <input type="time">

                    </div>

                </div>

                <div class="grid">

                    <div>

                        <label>Mesa</label>
                        <select>
                            <option>Mesa 01</option>
                            <option>Mesa 02</option>
                            <option>Mesa VIP</option>
                        </select>

                    </div>

                    <div>

                        <label>Personas</label>
                        <select>
                            <option>2 personas</option>
                            <option>4 personas</option>
                            <option>6 personas</option>
                            <option>8 personas</option>
                        </select>

                    </div>

                </div>

                <label>Notas adicionales</label>
                <textarea placeholder="Ej. Cliente alérgico a mariscos..."></textarea>

                <div class="summary">

                    <h5>Resumen de Reserva</h5>

                    <div class="summary-item">
                        <span>Estado</span>
                        <strong>Pendiente</strong>
                    </div>

                    <div class="summary-item">
                        <span>Confirmación</span>
                        <strong>Automática</strong>
                    </div>

                    <div class="summary-item">
                        <span>Tiempo estimado</span>
                        <strong>2 horas</strong>
                    </div>

                    <div class="total">
                        <span>Capacidad</span>
                        <span>4 personas</span>
                    </div>

                </div>

                <br>

                <button class="btn-primary">Crear Reserva</button>

                <br><br>

                <button class="btn-outline">Cancelar</button>

            </form>

        </div>

    </main>


<script id="responsive-sidebar-upgrade-script">
const menuToggle=document.getElementById("menuToggle");
const sidebar=document.querySelector(".sidebar");
const overlay=document.getElementById("sidebarOverlay");

menuToggle?.addEventListener("click",()=>{
 sidebar?.classList.toggle("open");
 overlay?.classList.toggle("show");
});

overlay?.addEventListener("click",()=>{
 sidebar?.classList.remove("open");
 overlay?.classList.remove("show");
});
</script>

</body>

</html>
