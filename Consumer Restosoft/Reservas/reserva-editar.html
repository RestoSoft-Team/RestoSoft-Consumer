<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RestSoft - Editar Reserva</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {

            --background: #fbfcfb;

            --primary: #6b1e28;
            --primary-light: #8a3b47;

            --dark: #262f3c;
            --dark-light: #39485c;

            --soft: #b09da2;
            --soft-light: #d9d2d4;

            --white: #ffffff;

            --gray: #6f7782;

            --success: #3d8b5c;
            --warning: #d9a441;
            --danger: #bb3a4b;

            --shadow: 0 10px 40px rgba(38, 47, 60, 0.08);

            --radius: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--background);
            color: var(--dark);
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100vh;
            background: var(--dark);
            padding: 28px 22px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 42px;
        }

        .brand-icon {
            width: 58px;
            height: 58px;
            border-radius: 18px;
            background: rgba(255, 255, 255, .08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
        }

        .brand h3 {
            color: white;
            font-weight: 800;
        }

        .brand p {
            color: #cbd3df;
            font-size: 13px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-link {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 18px;
            border-radius: 18px;
            color: #d9e0ea;
            transition: .3s;
        }

        .menu-link:hover {
            background: rgba(255, 255, 255, .06);
            transform: translateX(4px);
            color: white;
        }

        .menu-link.active {
            background: var(--primary);
            color: white;
        }

        /* MAIN */

        .main {
            margin-left: 280px;
            padding: 34px;
        }

        /* TOPBAR */

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 34px;
        }

        .title h1 {
            font-size: 38px;
            font-weight: 800;
        }

        .title p {
            color: var(--gray);
        }

        /* CARD */

        .card {
            background: white;
            border-radius: 32px;
            padding: 32px;
            box-shadow: var(--shadow);
            max-width: 980px;
        }

        .card-header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 26px;
        }

        .badge-status {
            padding: 10px 16px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 13px;
            background: rgba(217, 164, 65, .15);
            color: var(--warning);
        }

        .badge-confirmed {
            background: rgba(61, 139, 92, .15);
            color: var(--success);
        }

        /* FORM */

        label {
            font-weight: 600;
            margin-bottom: 8px;
        }

        input,
        select,
        textarea {
            width: 100%;
            border: none;
            background: #f7f8fa;
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 18px;
            min-height: 55px;
            transition: .3s;
        }

        textarea {
            min-height: 120px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border: 1px solid var(--primary);
            background: white;
        }

        /* GRID */

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        /* ACTIONS */

        .actions {
            display: flex;
            gap: 14px;
            margin-top: 10px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 14px 22px;
            font-weight: 600;
            transition: .3s;
        }

        .btn-primary:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
        }

        .btn-outline {
            border: 2px solid var(--dark);
            background: none;
            border-radius: 16px;
            padding: 14px 22px;
            font-weight: 600;
        }

        .btn-danger {
            border: none;
            background: var(--danger);
            color: white;
            border-radius: 16px;
            padding: 14px 22px;
            font-weight: 600;
        }

        /* INFO BOX */

        .info-box {
            margin-top: 22px;
            padding: 22px;
            background: #fafafa;
            border-radius: 22px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .info-row span {
            color: var(--gray);
        }

        /* RESPONSIVE */

        @media(max-width:992px) {

            .main {
                margin-left: 90px;
            }

            .sidebar {
                width: 90px;
            }

        }

        @media(max-width:768px) {

            .grid {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: column;
            }

        }
    </style>


<style id="responsive-sidebar-upgrade">
.mobile-menu-btn{display:none;border:none;background:var(--primary);color:#fff;width:50px;height:50px;border-radius:14px;font-size:20px}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:.3s;z-index:998}
.sidebar-overlay.show{opacity:1;visibility:visible}

@media(max-width:992px){
    .sidebar{width:90px}
    .sidebar .menu-title,.sidebar .logo h3{display:none}
    .sidebar .menu-item span{display:none}
    .main{margin-left:90px}
}

@media(max-width:768px){
    .sidebar{
        width:280px!important;
        left:-280px!important;
        transition:.3s;
        z-index:999;
    }

    .sidebar.open{left:0!important}

    .sidebar .menu-title,
    .sidebar .logo h3,
    .sidebar .menu-item span{
        display:block;
    }

    .main{
        margin-left:0!important;
        padding:18px!important;
    }

    .mobile-menu-btn{
        display:flex;
        align-items:center;
        justify-content:center;
    }

    .topbar{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }

    .topbar-actions{
        width:100%;
        flex-direction:column;
    }

    .search-box{
        width:100%;
        min-width:100%;
    }
}
</style>

</head>

<body>

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-icon">
                <i class="fa-solid fa-pen-to-square"></i>
            </div>

            <div>
                <h3>RestSoft</h3>
                <p>Editar Reserva</p>
            </div>

        </div>

        <div class="menu">

            <a class="menu-link" href="#">Dashboard</a>

            <a class="menu-link active" href="#">Reservas</a>

            <a class="menu-link" href="#">Mesas</a>

            <a class="menu-link" href="#">Clientes</a>

        </div>

    </aside>

    <!-- MAIN -->

    <main class="main">

        <div class="topbar">
<button id="menuToggle" class="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>

            <div class="title">

                <h1>Editar Reserva</h1>

                <p>Modifica los datos de la reserva seleccionada</p>

            </div>

        </div>

        <div class="card">

            <div class="card-header-info">

                <div>

                    <h3 style="margin:0;">Reserva #A1024</h3>

                    <p style="color:var(--gray);margin:0;">Cliente: María Rodríguez</p>

                </div>

                <div class="badge-status badge-confirmed">
                    Confirmada
                </div>

            </div>

            <form>

                <label>Nombre del cliente</label>
                <input type="text" value="María Rodríguez">

                <div class="grid">

                    <div>
                        <label>Fecha</label>
                        <input type="date" value="2026-06-02">
                    </div>

                    <div>
                        <label>Hora</label>
                        <input type="time" value="20:30">
                    </div>

                </div>

                <div class="grid">

                    <div>
                        <label>Mesa</label>
                        <select>
                            <option selected>Mesa 04</option>
                            <option>Mesa 01</option>
                            <option>Mesa VIP</option>
                        </select>
                    </div>

                    <div>
                        <label>Personas</label>
                        <select>
                            <option selected>4 personas</option>
                            <option>2 personas</option>
                            <option>6 personas</option>
                        </select>
                    </div>

                </div>

                <label>Notas</label>
                <textarea>Cliente solicita mesa cerca de ventana.</textarea>

                <div class="info-box">

                    <div class="info-row">
                        <span>Creada</span>
                        <strong>28 May 2026</strong>
                    </div>

                    <div class="info-row">
                        <span>Estado actual</span>
                        <strong>Confirmada</strong>
                    </div>

                    <div class="info-row">
                        <span>Tiempo estimado</span>
                        <strong>2 horas</strong>
                    </div>

                </div>

                <div class="actions">

                    <button type="button" class="btn-primary">
                        Guardar Cambios
                    </button>

                    <button type="button" class="btn-outline">
                        Cancelar
                    </button>

                    <button type="button" class="btn-danger">
                        Eliminar
                    </button>

                </div>

            </form>

        </div>

    </main>


<script id="responsive-sidebar-upgrade-script">
const menuToggle=document.getElementById("menuToggle");
const sidebar=document.querySelector(".sidebar");
const overlay=document.getElementById("sidebarOverlay");

menuToggle?.addEventListener("click",()=>{
 sidebar?.classList.toggle("open");
 overlay?.classList.toggle("show");
});

overlay?.addEventListener("click",()=>{
 sidebar?.classList.remove("open");
 overlay?.classList.remove("show");
});
</script>

</body>

</html>
