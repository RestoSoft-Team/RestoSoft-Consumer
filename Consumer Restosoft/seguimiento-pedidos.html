<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestSoft - Monitor de Pedidos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/seguimiento-pedido.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <script type="module" src="js/datos/theme-loader.js"></script>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div id="sidebar-container" class="sidebar"></div>

  <main class="main">
    <div class="topbar">
      <button id="menuToggle" class="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>
      <div class="page-title">
        <h1>Monitor de Pedidos</h1>
        <p>Seguimiento visual de órdenes y tiempos de preparación en tiempo real.</p>
      </div>
      <div class="topbar-right">
        <div id="infoPerfilContainer" class="profile">
            <p style="color: var(--gray); text-align: center; padding: 20px">Cargando perfil...</p>
        </div>
      </div>
    </div>

    <div class="filters" id="filtersContainer">
      <button class="filter-btn active" data-filter="TODOS">Todos</button>
      <button class="filter-btn" data-filter="PENDIENTE">Pendientes</button>
      <button class="filter-btn" data-filter="PREPARANDO">Preparando</button>
      <button class="filter-btn" data-filter="LISTO">Listos</button>
    </div>

    <div class="table-card">
      <div class="table-header">
        <div>
          <h4>Órdenes Activas</h4>
          <p>Estado de mesas, meseros y unidades de producto</p>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table-modern">
          <thead>
            <tr>
              <th>Código</th>
              <th>Mesero</th>
              <th>Mesa(s)</th>
              <th>Productos (Unidades y Tiempos)</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="tablaPedidos">
            <tr>
              <td colspan="5" class="empty-state">Cargando pedidos...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module" src="js/datos/sidebar.js"></script>
  <script type="module" src="js/datos/pedidoSeguimiento.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
  <script type="module" src="js/datos/notificaciones.js"></script>
</body>
</html>
