<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No encontrado — RestSoft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #fbfcfb;
            color: #262f3c;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-wrap {
            text-align: center;
            padding: 40px;
            max-width: 480px;
        }

        .error-icon {
            width: 100px;
            height: 100px;
            border-radius: 32px;
            background: rgba(107, 30, 40, 0.07);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 32px;
            font-size: 40px;
            color: #6b1e28;
        }

        .error-code {
            font-size: 120px;
            font-weight: 800;
            color: rgba(107, 30, 40, 0.06);
            line-height: 1;
            margin-bottom: -20px;
            letter-spacing: -8px;
        }

        .error-wrap h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .error-wrap p {
            font-size: 15px;
            color: #6f7782;
            line-height: 1.7;
            margin-bottom: 32px;
        }

        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-e {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
        }

        .btn-e-primary {
            background: #6b1e28;
            color: white;
        }

        .btn-e-primary:hover {
            background: #8a3b47;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(107, 30, 40, 0.25);
        }

        .btn-e-ghost {
            background: none;
            border: 2px solid #262f3c;
            color: #262f3c;
        }

        .btn-e-ghost:hover {
            background: #262f3c;
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <div class="error-wrap">
        <div class="error-code">404</div>
        <div class="error-icon">
            <i class="fa-solid fa-store-slash"></i>
        </div>
        <h1>Empresa no encontrada</h1>
        <p>El restaurante que buscas no existe o ya no está disponible. Verifica que la dirección sea correcta.</p>
        <div class="error-actions">
            <a href="/" class="btn-e btn-e-primary">
                <i class="fa-solid fa-house"></i> Ir al Inicio
            </a>
            <button onclick="history.back()" class="btn-e btn-e-ghost">
                <i class="fa-solid fa-arrow-left"></i> Volver
            </button>
        </div>
    </div>
</body>

</html>
