<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestSoft - Pantalla de Cocina (KDS)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/pedido-cocina.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <script type="module" src="js/datos/theme-loader.js"></script>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div id="sidebar-container" class="sidebar"></div>

    <main class="main">
        <div class="topbar">
            <button id="menuToggle" class="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>
            <div class="page-title">
                <h1>Pantalla de Cocina</h1>
                <p>Monitorea y administra pedidos en tiempo real.</p>
            </div>
            <div class="topbar-right">
                <div id="infoPerfilContainer" class="profile">
            <p style="color: var(--gray); text-align: center; padding: 20px">
              Cargando perfil...
            </p>
          </div>
        </div>
            </div>
        </div>

        <!-- ESTADÍSTICAS -->
        <!-- 👇 Cambiado a col-12 col-md-6 col-xl-4 para mejor responsividad -->
        <div class="row g-3 g-xl-4 stats-grid mb-4">
            <div class="col-12 col-md-6 col-xl-4">
                <div class="stats-card">
                    <div class="stats-top">
                        <div class="stats-icon icon-warning"><i class="fa-solid fa-clock"></i></div>
                        <span class="status warning">Pendientes</span>
                    </div>
                    <h2 id="stat-pendientes">0</h2>
                    <p>Pedidos por iniciar</p>
                </div>
            </div>
            <div class="col-12 col-md-6 col-xl-4">
                <div class="stats-card">
                    <div class="stats-top">
                        <div class="stats-icon icon-danger"><i class="fa-solid fa-fire"></i></div>
                        <span class="status danger">En Cocina</span>
                    </div>
                    <h2 id="stat-preparando">0</h2>
                    <p>Pedidos preparando</p>
                </div>
            </div>
            <div class="col-12 col-md-12 col-xl-4">
                <div class="stats-card">
                    <div class="stats-top">
                        <div class="stats-icon icon-success"><i class="fa-solid fa-circle-check"></i></div>
                        <span class="status success">Listos</span>
                    </div>
                    <h2 id="stat-listos">0</h2>
                    <p>Pedidos completados hoy</p>
                </div>
            </div>
        </div>

        <!-- TABLERO KANBAN -->
        <div class="board">
            <!-- Columna Pendientes -->
            <div class="board-column">
                <div class="board-header">
                    <h4><i class="fa-solid fa-clock"></i> Pendientes</h4>
                    <div class="badge-count" id="count-pendientes">0</div>
                </div>
                <div class="board-cards" id="col-pendientes">
                    <p class="empty-text">Cargando pedidos...</p>
                </div>
            </div>

            <!-- Columna Preparando -->
            <div class="board-column">
                <div class="board-header">
                    <h4><i class="fa-solid fa-fire"></i> Preparando</h4>
                    <div class="badge-count" id="count-preparando">0</div>
                </div>
                <div class="board-cards" id="col-preparando"></div>
            </div>

            <!-- Columna Listos -->
            <div class="board-column">
                <div class="board-header">
                    <h4><i class="fa-solid fa-circle-check"></i> Listos</h4>
                    <div class="badge-count" id="count-listos">0</div>
                </div>
                <div class="board-cards" id="col-listos"></div>
            </div>
        </div>
    </main>

    <script type="module" src="js/datos/sidebar.js"></script>
    <script type="module" src="js/datos/cocina.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script type="module" src="js/datos/notificaciones.js"></script>
</body>
</html>
