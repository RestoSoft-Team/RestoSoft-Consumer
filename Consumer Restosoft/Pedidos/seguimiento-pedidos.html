<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestSoft - Monitor de Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/seguimiento-pedido.css">
    <link rel="stylesheet" href="../css/sidebar.css">
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="sidebar">
        <!-- (Reemplaza esto con tu sidebar actual) -->
        <div class="logo">
            <div class="logo-box"><i class="fa-solid fa-utensils"></i></div>
            <h3>RestSoft</h3>
        </div>
        <div class="menu-title">Navegación</div>
        <a class="menu-item" href="Dashboard-example.html"><i class="fa-solid fa-chart-line"></i><span>Dashboard</span></a>
    </div>

    <main class="main">
        <div class="topbar">
            <button id="menuToggle" class="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>
            <div class="page-title">
                <h1>Monitor de Pedidos</h1>
                <p>Seguimiento visual de órdenes y tiempos de preparación en tiempo real.</p>
            </div>
            <button class="btn-premium" id="btnActualizar">
                <i class="fa-solid fa-rotate"></i> Actualizar
            </button>
        </div>

        <div class="filters" id="filtersContainer">
            <button class="filter-btn active" data-filter="TODOS">Todos</button>
            <button class="filter-btn" data-filter="PENDIENTE">Pendientes</button>
            <button class="filter-btn" data-filter="PREPARANDO">Preparando</button>
            <button class="filter-btn" data-filter="LISTO">Listos</button>
        </div>

        <div class="table-card">
            <div class="table-header">
                <div>
                    <h4>Órdenes Activas</h4>
                    <p>Estado de mesas, meseros y unidades de producto</p>
                </div>
            </div>
            
            <div class="table-responsive">
                <table class="table-modern">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Mesero</th>
                            <th>Mesa(s)</th>
                            <th>Productos (Unidades y Tiempos)</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="tablaPedidos">
                        <tr><td colspan="5" class="empty-state">Cargando pedidos...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script type="module" src="../js/datos/sidebar.js"></script>
    <script type="module" src="../js/datos/pedidoSeguimiento.js"></script>
</body>
</html>
