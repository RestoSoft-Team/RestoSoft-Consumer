<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestSoft - Crear Platillo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/crear-platillo.css" />
    <script type="module" src="js/datos/theme-loader.js"></script>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div id="sidebar-container" class="sidebar"></div>

    <!-- MAIN -->
    <main class="main">
        <div class="topbar">
            <button id="menuToggle" class="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>
            <div class="title">
                <h1 id="formTitle">Crear Platillo</h1>
                <p id="formSubtitle">Registra un nuevo producto para el menú</p>
            </div>
            <div class="topbar-right">
                <div id="infoPerfilContainer" class="profile">
                    <p style="color: var(--gray); text-align: center; padding: 20px;">Cargando...</p>
                </div>
            </div>
        </div>

        <div class="grid">
            <!-- FORM -->
            <div class="card">
                <h3>Información del platillo</h3>
                <p>Completa los datos del nuevo producto</p>

                <form id="productForm">
                    <div class="form-group">
                        <label for="nombre">Nombre del platillo</label>
                        <input type="text" id="nombre" placeholder="Ej: Hamburguesa Premium" required>
                    </div>

                    <div class="form-group">
                        <label for="idcategoria">Categoría</label>
                        <select id="idcategoria" required>
                            <option value="">Cargando categorías...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="precio">Precio</label>
                        <input type="number" id="precio" step="0.01" placeholder="0.00" required>
                    </div>

                    <div class="form-group">
                        <label for="descripcion">Descripción</label>
                        <textarea id="descripcion" placeholder="Describe el platillo..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Imagen del platillo</label>
                        <div class="upload" id="uploadTrigger">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                            <p id="uploadText">Arrastra o selecciona una imagen</p>
                            <small>PNG, JPG hasta 5MB</small>
                        </div>
                        <input type="file" id="imagen" accept="image/*" style="display: none;">
                    </div>

                    <div class="actions">
                        <button type="submit" class="btn-primary" id="submitBtn">
                            <i class="fa-solid fa-save me-2"></i> Guardar Platillo
                        </button>
                        <button type="button" class="btn-outline" id="cancelBtn">
                            <i class="fa-solid fa-xmark me-2"></i> Cancelar
                        </button>
                    </div>
                </form>
            </div>

            <!-- PREVIEW -->
            <div class="card">
                <h3>Vista previa</h3>
                <p>Cómo se verá en el menú</p>

                <div class="preview-card">
                    <div class="preview-img" id="previewImgContainer">
                        <i class="fa-solid fa-utensils"></i>
                    </div>
                    <h4 id="previewNombre">Nombre del platillo</h4>
                    <small id="previewDescripcion">Descripción del platillo...</small>
                    <div class="price" id="previewPrecio">$0</div>
                </div>
            </div>
        </div>
    </main>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/datos/platilloCrear.js"></script>
    <script type="module" src="js/datos/sidebar.js"></script>
    <script type="module" src="js/datos/notificaciones.js"></script>
</body>
</html>
