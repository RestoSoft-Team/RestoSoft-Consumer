<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #fbfcfb;
      --primary: #0a0a0a;
      --dark: #0a0a0a;
      --accent: #d9a441;
      --text: #0a0a0a;
      --text-sec: #5e5e5e;
      --border: #e6e6e8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      letter-spacing: -0.02em;
    }

    .register-form-side {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
      position: relative;
      overflow-y: auto;
      max-height: 100vh;
    }

    .back-btn {
      position: absolute;
      top: 40px;
      left: 40px;
      color: var(--text-sec);
      text-decoration: none;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: 0.3s;
      z-index: 10;
    }

    .back-btn:hover {
      color: var(--text);
      transform: translateX(-4px);
    }

    .register-card {
      width: 100%;
      max-width: 450px;
      margin: 60px 0;
    }

    .brand-mark {
      width: 56px;
      height: 56px;
      background: var(--dark);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    }

    .brand-mark i {
      color: var(--accent);
      font-size: 1.5rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 12px;
      letter-spacing: -0.04em;
    }

    h1 span {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 400;
      color: var(--text-sec);
    }

    .subtitle {
      font-size: 1rem;
      color: var(--text-sec);
      margin-bottom: 32px;
      font-weight: 300;
    }

    .dropzone {
      width: 100px;
      height: 100px;
      border: 2px dashed var(--border);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.3s;
      margin-bottom: 32px;
      overflow: hidden;
      position: relative;
      background: #f7f8fa;
    }

    .dropzone:hover {
      border-color: var(--dark);
      background: white;
    }

    .dropzone .dropzone-text {
      color: var(--text-sec);
      font-size: 0.75rem;
      text-align: center;
      font-weight: 600;
    }

    #preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap i {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sec);
      font-size: 1rem;
      transition: 0.3s;
      pointer-events: none;
    }

    .premium-input {
      width: 100%;
      background: #f7f8fa;
      border: 1px solid transparent;
      border-radius: 16px;
      min-height: 55px;
      padding: 0 18px 0 48px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 1rem;
      transition: 0.3s;
    }

    .premium-input:focus {
      background: white;
      border: 1px solid var(--dark);
      outline: none;
      box-shadow: 0 0 0 4px rgba(10, 10, 10, 0.05);
    }

    .premium-input:focus+i {
      color: var(--dark);
    }

    /* Ajuste para el input de fecha */
    input[type="date"].premium-input::-webkit-calendar-picker-indicator {
      cursor: pointer;
      opacity: 0.5;
      transition: 0.3s;
    }

    input[type="date"].premium-input::-webkit-calendar-picker-indicator:hover {
      opacity: 1;
    }

    .form-row {
      display: flex;
      gap: 16px;
    }

    .form-row .form-group {
      flex: 1;
    }

    .btn-register {
      width: 100%;
      background: var(--dark);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
    }

    .btn-register:hover {
      background: #2c2c2c;
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .login-text {
      text-align: center;
      color: var(--text-sec);
      font-size: 0.95rem;
      margin-top: 24px;
    }

    .login-text a {
      color: var(--text);
      font-weight: 700;
      text-decoration: none;
    }

    .login-text a:hover {
      color: var(--accent);
    }

    .register-visual-side {
      flex: 1;
      background: var(--dark);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
    }

    .visual-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 70% 20%, rgba(217, 164, 65, 0.15) 0%, transparent 50%), radial-gradient(circle at 20% 80%, rgba(40, 40, 40, 0.8) 0%, transparent 50%);
    }

    .visual-content {
      position: relative;
      z-index: 2;
      max-width: 500px;
      color: white;
    }

    .visual-icon {
      width: 70px;
      height: 70px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: var(--accent);
      margin-bottom: 32px;
    }

    .visual-content h2 {
      font-size: 3rem;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 24px;
      letter-spacing: -0.04em;
    }

    .visual-content h2 span {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 400;
      color: var(--accent);
    }

    .visual-content p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 300;
    }

    .bg-text {
      position: absolute;
      bottom: -40px;
      right: -20px;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 12rem;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.03);
      pointer-events: none;
      z-index: 1;
    }

    @media (max-width: 992px) {
      .register-visual-side {
        display: none;
      }

      .register-form-side {
        padding: 80px 40px;
      }
    }

    @media (max-width: 576px) {
      .register-form-side {
        padding: 60px 24px;
      }

      h1 {
        font-size: 2rem;
      }

      .back-btn {
        top: 24px;
        left: 24px;
      }

      .form-row {
        flex-direction: column;
        gap: 0;
      }
    }
  </style>
</head>

<body>
  <div class="register-form-side">
    <a href="#" onclick="history.back(); return false;" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i> Volver atrás
    </a>
    <div class="register-card">
      <div class="brand-mark"><i class="fa-solid fa-user-plus"></i></div>
      <h1>Crea tu <span>cuenta</span></h1>
      <p class="subtitle">Únete y empieza a reservar en tus lugares favoritos.</p>

      <form id="register-form">
        <div class="dropzone" id="dropzone">
          <span class="dropzone-text"><i class="fa-solid fa-camera"></i><br>Foto</span>
          <img id="preview-img" src="" alt="Preview">
          <input type="file" id="file-input" accept="image/*" hidden>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Nombres</label>
            <div class="input-wrap">
              <input type="text" id="reg-nombres" class="premium-input" placeholder="Juan" required>
              <i class="fa-solid fa-user"></i>
            </div>
          </div>
          <div class="form-group">
            <label>Apellidos</label>
            <div class="input-wrap">
              <input type="text" id="reg-apellidos" class="premium-input" placeholder="Pérez" required>
              <i class="fa-solid fa-user"></i>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>Correo electrónico</label>
          <div class="input-wrap">
            <input type="email" id="reg-email" class="premium-input" placeholder="tu@email.com" required>
            <i class="fa-solid fa-envelope"></i>
          </div>
        </div>

        <div class="form-group">
          <label>Teléfono</label>
          <div class="input-wrap">
            <input type="tel" id="reg-telefono" class="premium-input" placeholder="+34 600 000 000" required>
            <i class="fa-solid fa-phone"></i>
          </div>
        </div>

        <div class="form-group">
          <label>Fecha de Nacimiento</label>
          <div class="input-wrap">
            <input type="date" id="reg-fecha-nacimiento" class="premium-input" required>
            <i class="fa-solid fa-cake-candles"></i>
          </div>
        </div>

        <div class="form-group">
          <label>Contraseña</label>
          <div class="input-wrap">
            <input type="password" id="reg-password" class="premium-input" placeholder="Mínimo 8 caracteres" required>
            <i class="fa-solid fa-lock"></i>
          </div>
        </div>

        <button type="submit" class="btn-register">Crear Cuenta <i class="fa-solid fa-arrow-right"></i></button>
      </form>
      <p class="login-text">¿Ya tienes una cuenta? <a href="login-cliente.html">Inicia sesión</a></p>
    </div>
  </div>
  <div class="register-visual-side">
    <div class="visual-overlay"></div>
    <div class="bg-text">Únete</div>
    <div class="visual-content">
      <div class="visual-icon"><i class="fa-solid fa-star"></i></div>
      <h2>Beneficios que <span>disfrutarás</span></h2>
      <p>Acumula puntos con cada reserva, accede a menús exclusivos y salta las filas en tus restaurantes preferidos.
      </p>
    </div>
  </div>
  <script type="module" src="js/datos/auth.js"></script>
</body>

</html>
