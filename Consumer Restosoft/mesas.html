<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestSoft | Gestión de Mesas</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/mesas.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <script type="module" src="js/datos/theme-loader.js"></script>
</head>

<body>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div id="sidebar-container" class="sidebar"></div>

  <main class="main">
    <div class="topbar">
      <button id="menuToggle" class="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>
      <div class="page-title">
        <h1>Gestión de Mesas</h1>
        <p>Administra la disponibilidad de las mesas de tu restaurante.</p>
      </div>
      <div class="topbar-right">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <!-- Se añade ID para el buscador empresarial -->
          <input type="text" id="searchInput" placeholder="Buscar por número o zona...">
        </div>
        <div id="infoPerfilContainer" class="profile">
            <p style="color: var(--gray); text-align: center; padding: 20px">
              Cargando perfil...
            </p>
          </div>
        </div>
      </div>
    </div>

    <!-- Estado de Error -->
    <div id="error-state" class="error-container" style="display: none;">
      <div class="error-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
      <h3>Error de Conexión</h3>
      <p id="error-message">No se pudo conectar con la base de datos.</p>
      <div class="error-actions">
        <button class="btn-primary-custom" onclick="location.reload()">
          <i class="fa-solid fa-rotate-right"></i> Reintentar
        </button>
        <a href="mailto:soporte@restosoft.com" class="btn-outline-custom">
          <i class="fa-solid fa-headset"></i> Soporte
        </a>
      </div>
    </div>

    <!-- Dashboard Content -->
    <div id="dashboard-content">
      <div class="stats-grid row g-4">
        <div class="col-xl-3 col-md-6">
          <div class="stats-card">
            <div class="stats-top">
              <div class="stats-icon success-icon"><i class="fa-solid fa-circle-check"></i></div>
            </div>
            <h2 id="stat-disponibles">
              <div class="skeleton skeleton-text"></div>
            </h2>
            <p>Disponibles</p>
          </div>
        </div>
        <div class="col-xl-3 col-md-6">
          <div class="stats-card">
            <div class="stats-top">
              <div class="stats-icon danger-icon"><i class="fa-solid fa-users"></i></div>
            </div>
            <h2 id="stat-ocupadas">
              <div class="skeleton skeleton-text"></div>
            </h2>
            <p>Ocupadas</p>
          </div>
        </div>
        <div class="col-xl-3 col-md-6">
          <div class="stats-card">
            <div class="stats-top">
              <div class="stats-icon warning-icon"><i class="fa-solid fa-calendar-check"></i></div>
            </div>
            <h2 id="stat-reservadas">
              <div class="skeleton skeleton-text"></div>
            </h2>
            <p>Reservadas</p>
          </div>
        </div>
        <div class="col-xl-3 col-md-6">
          <div class="stats-card">
            <div class="stats-top">
              <div class="stats-icon" style="background:var(--gray);"><i class="fa-solid fa-ban"></i></div>
            </div>
            <h2 id="stat-fuera-servicio">
              <div class="skeleton skeleton-text"></div>
            </h2>
            <p>Inactivas</p>
          </div>
        </div>
      </div>

      <div class="filters" id="filtersContainer">
        <div class="skeleton skeleton-btn"></div>
        <div class="skeleton skeleton-btn"></div>
        <div class="skeleton skeleton-btn"></div>
      </div>

      <div class="tables-grid" id="tablesGrid"></div>
    </div>
  </main>
  <script type="module" src="../js/datos/sidebar.js"></script>


  <!-- Modales Empresariales -->
  <div id="modalGenerico" class="modal-overlay">
    <div class="modal-box">
      <button class="modal-close" id="modalCloseBtn"><i class="fa-solid fa-xmark"></i></button>
      <h3 id="modalTitle"></h3>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <div id="notification" class="notification">
    <div class="notification-icon"><i class="fa-solid fa-circle-check"></i></div>
    <div class="notification-content-text">
      <strong>Operación Exitosa</strong>
      <p id="notificationText">La acción se realizó correctamente.</p>
    </div>
  </div>




  <script type="module" src="js/datos/sidebar.js"></script>
  <script type="module" src="js/datos/mesas.js"></script>
  <script type="module" src="js/datos/notificaciones.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</body>

</html>
