<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RestSoft - Promociones</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <!-- CSS propios -->
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/promociones.css" />
    <!-- Theme loader -->
    <script type="module" src="js/datos/theme-loader.js"></script>
</head>

<body>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div id="sidebar-container" class="sidebar"></div>

    <!-- MAIN -->
    <main class="main">
        <div class="topbar">
            <button id="menuToggle" class="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>
            <div class="title">
                <h1>Promociones</h1>
                <p>GestiÃ³n de descuentos y ofertas del restaurante</p>
            </div>
            <div class="topbar-right"><div id="infoPerfilContainer" class="profile"><p style="color: var(--gray); text-align: center; padding: 20px;">Cargando...</p></div></div>
        </div>

        <div class="grid">
            <!-- LEFT: Lista de promociones -->
            <div class="card">
                <h3>Promociones activas</h3>
                <div id="promocionesContainer" class="promo-grid">
                    <p class="text-muted">Cargando promociones...</p>
                </div>
            </div>

            <!-- RIGHT: Formulario -->
            <div class="card">
                <h3 id="formTitle">Crear promociÃ³n</h3>
                <form id="promoForm">
                    <input type="hidden" id="promoId" value="">

                    <label for="nombrePromo">Nombre</label>
                    <input type="text" id="nombrePromo" placeholder="Ej: Combo especial" required>

                    <label for="valorDescuento">Valor descuento</label>
                    <input type="number" step="0.01" id="valorDescuento" placeholder="Ej: 20.00" required>

                    <label for="fechaInicio">Fecha inicio</label>
                    <input type="date" id="fechaInicio" required>

                    <label for="fechaFin">Fecha fin</label>
                    <input type="date" id="fechaFin" required>

                    <label for="descripcionPromo">DescripciÃ³n</label>
                    <textarea id="descripcionPromo" placeholder="Describe la promociÃ³n..."></textarea>

                    <label for="estadoPromo">Estado</label>
                    <select id="estadoPromo">
                        <option value="ACTIVA">Activa</option>
                        <option value="INACTIVA">Inactiva</option>
                    </select>

                    <label for="idsPlatos">Platos incluidos</label>
                    <select id="idsPlatos" multiple class="form-control" style="height: auto; padding: 8px;">
                        <!-- Se llena con JavaScript -->
                    </select>
                    <small class="text-muted">MantÃ©n presionado Ctrl para seleccionar varios</small>

                    <button type="submit" class="btn-primary" id="submitBtn">Crear PromociÃ³n</button>
                    <br><br>
                    <button type="button" class="btn-outline" id="cancelBtn">Cancelar</button>
                </form>
            </div>
        </div>
    </main>

    <!-- SCRIPTS -->
    <script type="importmap">
        {
            "imports": {
                "./js/": "./js/"
            }
        }
    </script>
    <script type="module" src="js/datos/promociones.js"></script>
    <script type="module" src="js/datos/sidebar.js"></script>
    <div class="notification-container" id="notificationContainer"></div>
</body>

</html>
