<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RestSoft - Editar Platillo (Completo)</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {

            --background: #fbfcfb;

            --primary: #6b1e28;
            --primary-light: #8a3b47;

            --dark: #262f3c;
            --dark-light: #39485c;

            --soft: #b09da2;
            --soft-light: #d9d2d4;

            --white: #ffffff;

            --gray: #6f7782;

            --success: #3d8b5c;

            --warning: #d9a441;

            --danger: #bb3a4b;

            --shadow: 0 10px 40px rgba(38, 47, 60, 0.08);

            --radius: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--background);
            color: var(--dark);
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100vh;
            background: var(--dark);
            padding: 28px 22px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 42px;
        }

        .brand-icon {
            width: 58px;
            height: 58px;
            border-radius: 18px;
            background: rgba(255, 255, 255, .08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
        }

        .brand h3 {
            color: white;
            font-weight: 800;
        }

        .brand p {
            color: #cbd3df;
            font-size: 13px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-link {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 18px;
            border-radius: 18px;
            color: #d9e0ea;
            transition: .3s;
        }

        .menu-link:hover {
            background: rgba(255, 255, 255, .06);
            transform: translateX(4px);
        }

        .menu-link.active {
            background: var(--primary);
            color: white;
        }

        /* MAIN */

        .main {
            margin-left: 280px;
            padding: 34px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 34px;
        }

        .title h1 {
            font-size: 38px;
            font-weight: 800;
        }

        .title p {
            color: var(--gray);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 28px;
        }

        .card {
            background: white;
            border-radius: 32px;
            padding: 30px;
            box-shadow: var(--shadow);
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
        }

        input,
        select,
        textarea {
            width: 100%;
            border: none;
            background: #f7f8fa;
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 16px;
            transition: .3s;
            font-family: 'Inter', sans-serif;
        }

        input,
        select {
            height: 55px;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border: 1px solid var(--primary);
            background: white;
        }

        /* IMAGE UPLOAD SYSTEM */

        .upload-zone {
            border: 2px dashed #d9d9d9;
            border-radius: 22px;
            padding: 22px;
            text-align: center;
            background: #fafafa;
            cursor: pointer;
            transition: .3s;
            position: relative;
            overflow: hidden;
        }

        .upload-zone:hover {
            border-color: var(--primary);
            background: white;
        }

        .upload-zone i {
            font-size: 28px;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .upload-zone input {
            display: none;
        }

        .preview-img {
            width: 100%;
            height: 200px;
            border-radius: 22px;
            object-fit: cover;
            display: none;
        }

        .preview-wrapper {
            position: relative;
        }

        .remove-img {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, .6);
            color: white;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            cursor: pointer;
        }

        /* SWITCH */

        .switch {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fafafa;
            padding: 14px;
            border-radius: 16px;
            margin-bottom: 16px;
        }

        .toggle {
            width: 52px;
            height: 28px;
            background: #ccc;
            border-radius: 50px;
            position: relative;
            cursor: pointer;
            transition: .3s;
        }

        .toggle::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            top: 3px;
            left: 3px;
            transition: .3s;
        }

        .toggle.active {
            background: var(--primary);
        }

        .toggle.active::after {
            left: 27px;
        }

        /* BUTTONS */

        .btn-primary {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 14px;
            font-weight: 600;
            transition: .3s;
        }

        .btn-primary:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
        }

        .btn-outline {
            width: 100%;
            border: 2px solid var(--dark);
            background: none;
            border-radius: 16px;
            padding: 14px;
            font-weight: 600;
        }

        @media(max-width:992px) {

            .grid {
                grid-template-columns: 1fr;
            }

            .sidebar {
                width: 90px;
            }

            .main {
                margin-left: 90px;
            }

        }
    </style>


<style id="responsive-sidebar-upgrade">
.mobile-menu-btn{display:none;border:none;background:var(--primary);color:#fff;width:50px;height:50px;border-radius:14px;font-size:20px}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:.3s;z-index:998}
.sidebar-overlay.show{opacity:1;visibility:visible}

@media(max-width:992px){
    .sidebar{width:90px}
    .sidebar .menu-title,.sidebar .logo h3{display:none}
    .sidebar .menu-item span{display:none}
    .main{margin-left:90px}
}

@media(max-width:768px){
    .sidebar{
        width:280px!important;
        left:-280px!important;
        transition:.3s;
        z-index:999;
    }

    .sidebar.open{left:0!important}

    .sidebar .menu-title,
    .sidebar .logo h3,
    .sidebar .menu-item span{
        display:block;
    }

    .main{
        margin-left:0!important;
        padding:18px!important;
    }

    .mobile-menu-btn{
        display:flex;
        align-items:center;
        justify-content:center;
    }

    .topbar{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }

    .topbar-actions{
        width:100%;
        flex-direction:column;
    }

    .search-box{
        width:100%;
        min-width:100%;
    }
}
</style>

</head>

<body>

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-icon">
                <i class="fa-solid fa-pen-to-square"></i>
            </div>
            <div>
                <h3>RestSoft</h3>
                <p>Editar Platillo</p>
            </div>
        </div>

        <div class="menu">
            <a class="menu-link active" href="#">Editar</a>
            <a class="menu-link" href="#">Menú</a>
            <a class="menu-link" href="#">Crear</a>
        </div>

    </aside>

    <!-- MAIN -->

    <main class="main">

        <div class="topbar">
<button id="menuToggle" class="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>

            <div class="title">
                <h1>Editar Platillo</h1>
                <p>Actualiza información, imagen y estado del producto</p>
            </div>

        </div>

        <div class="grid">

            <!-- FORM -->

            <div class="card">

                <label>Nombre del platillo</label>
                <input type="text" value="Hamburguesa Premium">

                <label>Categoría</label>
                <select>
                    <option selected>Comida rápida</option>
                    <option>Platos fuertes</option>
                    <option>Postres</option>
                </select>

                <label>Precio</label>
                <input type="text" value="$29.000">

                <label>Descripción</label>
                <textarea>Carne angus, queso cheddar, pan artesanal y salsa especial.</textarea>

                <!-- SWITCHES -->

                <div class="switch">
                    <span>Disponible en menú</span>
                    <div class="toggle active" onclick="toggle(this)"></div>
                </div>

                <div class="switch">
                    <span>Destacado</span>
                    <div class="toggle" onclick="toggle(this)"></div>
                </div>

                <!-- UPLOAD FULL -->

                <label>Imagen del platillo</label>

                <div class="upload-zone" onclick="document.getElementById('file').click()">

                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <p>Haz clic o arrastra una imagen</p>
                    <small>PNG / JPG hasta 5MB</small>

                    <input type="file" id="file" accept="image/*" onchange="previewImage(event)">

                </div>

                <div class="preview-wrapper">

                    <img id="preview" class="preview-img"
                        src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38">

                    <button class="remove-img" onclick="removeImage()">
                        <i class="fa-solid fa-x"></i>
                    </button>

                </div>

                <br>

                <button class="btn-primary">Actualizar Platillo</button>

                <br><br>

                <button class="btn-outline">Cancelar</button>

            </div>

            <!-- INFO -->

            <div class="card">

                <h3>Estadísticas</h3>

                <div style="background:#fafafa;padding:16px;border-radius:18px;margin-bottom:12px;">
                    <strong>Ventas hoy</strong>
                    <p>34 unidades</p>
                </div>

                <div style="background:#fafafa;padding:16px;border-radius:18px;margin-bottom:12px;">
                    <strong>Ingresos</strong>
                    <p>$986.000</p>
                </div>

                <div style="background:#fafafa;padding:16px;border-radius:18px;">
                    <strong>ID Producto</strong>
                    <p>#PL-1024</p>
                </div>

            </div>

        </div>

    </main>

    <script>

        function toggle(el) {
            el.classList.toggle("active");
        }

        function previewImage(event) {
            const file = event.target.files[0];
            const reader = new FileReader();

            reader.onload = function () {
                const img = document.getElementById("preview");
                img.src = reader.result;
                img.style.display = "block";
            }

            if (file) {
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            const img = document.getElementById("preview");
            const input = document.getElementById("file");

            img.style.display = "none";
            input.value = "";
        }

    </script>


<script id="responsive-sidebar-upgrade-script">
const menuToggle=document.getElementById("menuToggle");
const sidebar=document.querySelector(".sidebar");
const overlay=document.getElementById("sidebarOverlay");

menuToggle?.addEventListener("click",()=>{
 sidebar?.classList.toggle("open");
 overlay?.classList.toggle("show");
});

overlay?.addEventListener("click",()=>{
 sidebar?.classList.remove("open");
 overlay?.classList.remove("show");
});
</script>

</body>

</html>
