<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Restosoft</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <style>
        :root {
            --background: #fbfcfb;
            --primary: #6b1e28;
            --primary-light: #8a3b47;
            --dark: #262f3c;
            --dark-light: #39485c;
            --soft: #b09da2;
            --soft-light: #d9d2d4;
            --white: #ffffff;
            --gray: #6f7782;
            --success: #3d8b5c;
            --warning: #d9a441;
            --danger: #bb3a4b;
            --shadow: 0 10px 40px rgba(38, 47, 60, 0.08);
            --radius: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            background: var(--background);
            color: var(--dark);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Contenedor central de la tarjeta */
        .error-wrapper {
            width: 100%;
            max-width: 480px;
            animation: scaleIn 0.3s ease;
        }

        .card {
            background: var(--white);
            border-radius: 32px;
            padding: 40px 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        /* Icono de error adaptado de tus estilos de modal */
        .error-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            border-radius: 24px;
            background: rgba(187, 58, 75, 0.15); /* Fondo danger con opacidad */
            color: var(--danger);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-icon i {
            font-size: 40px;
        }

        .error-code {
            font-size: 64px;
            font-weight: 800;
            color: var(--dark);
            line-height: 1;
            margin-bottom: 8px;
            letter-spacing: -2px;
        }

        .error-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark-light);
            margin-bottom: 12px;
        }

        .error-message {
            color: var(--gray);
            line-height: 1.6;
            margin-bottom: 32px;
            font-size: 15px;
        }

        /* Botón primario de Restosoft */
        .btn-primary {
            padding: 16px 24px;
            border-radius: 16px;
            font-weight: 600;
            transition: 0.3s;
            cursor: pointer;
            border: none;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--primary);
            color: white;
            width: 100%;
            text-decoration: none;
            font-size: 16px;
        }

        .btn-primary:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(107, 30, 40, 0.2);
        }

        /* Elementos extra de diseño */
        .brand-watermark {
            margin-top: 24px;
            color: var(--soft);
            font-size: 13px;
            font-weight: 500;
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="error-wrapper">
        <div class="card">
            <div class="error-icon" id="iconContainer">
                <i class="ri-error-warning-fill"></i>
            </div>
            
            <h1 class="error-code" id="errorCode">500</h1>
            <h2 class="error-title" id="errorTitle">Oops, algo salió mal</h2>
            <p class="error-message" id="errorMessage">Ha ocurrido un error inesperado en el servidor. Por favor, inténtalo de nuevo más tarde.</p>
            
            <a href="dashboard.html" class="btn-primary">
                <i class="ri-arrow-left-line"></i>
                Volver al Dashboard
            </a>
        </div>
        <div class="brand-watermark" style="text-align: center;">
            Restosoft System
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Obtener los parámetros de la URL actual
            const urlParams = new URLSearchParams(window.location.search);
            
            // 2. Extraer los valores (o asignar valores por defecto si no existen)
            const code = urlParams.get('code') || '500';
            const msg = urlParams.get('msg') || 'No pudimos procesar tu solicitud. Por favor, contacta a soporte si el problema persiste.';
            
            // 3. Obtener referencias a los elementos del DOM
            const errorCodeEl = document.getElementById('errorCode');
            const errorMessageEl = document.getElementById('errorMessage');
            const errorTitleEl = document.getElementById('errorTitle');
            const iconContainer = document.getElementById('iconContainer');

            // 4. Inyectar los datos en el HTML
            errorCodeEl.textContent = code;
            errorMessageEl.textContent = msg;

            // 5. Lógica opcional: Cambiar título y colores según el código de error
            if (code === '404') {
                errorTitleEl.textContent = 'Página no encontrada';
                iconContainer.innerHTML = '<i class="ri-map-pin-user-fill"></i>';
                // Puedes cambiar a color warning si prefieres:
                // iconContainer.style.background = 'rgba(217, 164, 65, 0.15)';
                // iconContainer.style.color = 'var(--warning)';
            } else if (code === '403') {
                errorTitleEl.textContent = 'Acceso Denegado';
                iconContainer.innerHTML = '<i class="ri-lock-2-fill"></i>';
            } else if (code.startsWith('5')) {
                errorTitleEl.textContent = 'Error del Servidor';
                iconContainer.innerHTML = '<i class="ri-server-fill"></i>';
            } else {
                errorTitleEl.textContent = 'Aviso del Sistema';
            }
        });
    </script>

</body>
</html>
